{% extends "base.html" %}

{% block title %}Login Verification OTP{% endblock %}

{% block content %}

<h3>Hello {{ name }},</h3>

<p>
    Use the following OTP to verify your login:
</p>

<div style="text-align: center; margin: 25px 0;">
    <span style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">
        {{ otp }}
    </span>
</div>

<p>
    Please do not share this OTP with anyone.
</p>

{% endblock %}
