<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Final Whistle{% endblock %}</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color: #ffffff; border-radius: 8px; padding: 30px;">

                <tr>
                    <td align="center" style="padding-bottom: 20px;">
                        <h2 style="margin: 0;">Final Whistle</h2>
                    </td>
                </tr>

                <tr>
                    <td>
                        {% block content %}{% endblock %}
                    </td>
                </tr>

                <tr>
                    <td style="padding-top: 30px; text-align: center; font-size: 12px; color: #777777;">
                        <p style="margin: 0;">
                            Regards,<br>
                            Final Whistle Team
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
